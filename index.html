<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Registro de Clientes</title>

  <!-- PWA manifest & icons -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
  <meta name="theme-color" content="#0F5C9A">

  <style>
    :root {
      --bg: #E5E7EB;          /* gris neutro de fondo */
      --card: #FFFFFF;        /* tarjetas blancas tipo Fiori */
      --accent: #0F5C9A;      /* azul corporativo estilo SAP */
      --accent-soft: #E3ECF5; /* azul muy suave para fondos */
      --border: #D1D5DB;      /* borde gris claro */
      --text-main: #111827;   /* texto principal */
      --text-soft: #6B7280;   /* texto secundario */
      --danger: #B91C1C;      /* mensajes de error */
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 16px 12px;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 430px; /* más compacto, móvil corporativo */
      display: flex;
      flex-direction: column;
      gap: 16px; /* más espacio entre tarjetas */
    }

    .top-bar {
      background: var(--card);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.06);
      border: 1px solid var(--border);
    }

    .icon-button {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #F3F4F6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s, box-shadow 0.15s;
    }

    .icon-button:active {
      transform: scale(0.97);
      background: #E5E7EB;
      box-shadow: inset 0 0 0 1px var(--border);
    }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-soft);
      margin-bottom: 4px;
    }

    .input-sm {
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      width: 96px;
      background: #F9FAFB;
    }

    .input-sm:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-soft);
    }

    .route-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .row.space-between {
      justify-content: space-between;
    }

    .select {
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
      flex: 1;
      background: #F9FAFB;
    }

    .select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-soft);
    }

    .search-input {
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      flex: 1;
      background: #F9FAFB;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-soft);
    }

    .pill-button {
      border-radius: 10px; /* estilo rectángulo suave SAP Fiori */
      border: none;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--accent);
      color: #FFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 40px; /* botón ancho y cómodo para dedo */
      width: 100%; /* por defecto ocupan todo el ancho en mobile */
      transition: background 0.15s, transform 0.05s, box-shadow 0.15s;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.15);
    }

    .pill-button.secondary {
      background: #F3F4F6;
      color: var(--text-main);
      box-shadow: none;
      border: 1px solid var(--border);
    }

    .pill-button.full {
      width: 100%;
      justify-content: center;
    }

    .pill-button:active {
      transform: translateY(1px);
      background: #0B4A7A;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.2);
    }

    .pill-button.secondary:active {
      background: #E5E7EB;
      box-shadow: inset 0 0 0 1px var(--border);
    }

    .results-list {
      max-height: 150px;
      overflow-y: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #F9FAFB;
    }

    .result-item {
      padding: 6px 8px;
      border-bottom: 1px solid #E5E7EB;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item:hover {
      background: #E5EDF7;
    }

    .result-name {
      font-weight: 600;
    }

    .result-meta {
      font-size: 11px;
      color: var(--text-soft);
    }

    .selected-badge {
      font-size: 11px;
      color: var(--text-soft);
    }

    .selected-name {
      font-size: 13px;
      font-weight: 600;
    }

    .status-text {
      font-size: 11px;
      color: var(--text-soft);
    }

    .status-text.error {
      color: var(--danger);
    }

    .restruct-card {
      margin-top: 2px;
    }

    .day-block {
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #F9FAFB;
      overflow: hidden;
    }

    .day-header {
      padding: 6px 8px;
      background: var(--accent-soft);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      padding: 6px 8px;
      border-bottom: 1px solid #E5E7EB;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #F3F4F6;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #374151;
    }

    tr:nth-child(even) td {
      background: #F9FAFB;
    }

    tr:nth-child(odd) td {
      background: #FFFFFF;
    }

    .footer-space {
      height: 10px;
    }

    .restruct-button {
      margin-top: 2px;
    }

    /* Toggle switch */
    .toggle-switch {
      width: 32px;
      height: 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #F3F4F6;
      padding: 2px;
      display: flex;
      align-items: center;
      transition: background 0.15s;
    }

    .toggle-knob {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #4B5563;
      transition: transform 0.15s, background 0.15s;
    }

    .toggle-switch.on {
      background: var(--accent-soft);
    }

    .toggle-switch.on .toggle-knob {
      transform: translateX(14px);
      background: var(--accent);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.38);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .modal {
      background: var(--card);
      border-radius: 18px;
      padding: 16px 18px 14px;
      width: 92%;
      max-width: 430px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.35);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
    }

    .modal-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .modal-input {
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 9px 10px;
      font-size: 14px;
      outline: none;
      width: 100%;
      background: #F9FAFB;
    }

    .modal-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-soft);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 4px;
    }

    .chip-day {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .hidden-input {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Encabezado / pestaña superior -->
    <header class="top-bar">
      <label class="icon-button" title="Cargar base de datos (.txt)">
        📁
        <input id="fileInput" type="file" accept=".txt" class="hidden-input" />
      </label>

      <div class="row" style="flex:1; gap:12px;">
        <div class="route-group" style="flex:1;">
          <span class="field-label">Ruta</span>
          <input id="routeInput" type="text" class="input-sm" placeholder="17029" style="width:100%;"/>
        </div>

        <div style="flex:1;">
          <span class="field-label">Día</span>
          <select id="daySelect" class="select" style="width:100%;">
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
            <option value="Sábado">Sábado</option>
          </select>
        </div>
      </div>

    </header>

    <!-- Búsqueda + nuevo cliente -->
    <section class="card">
      <div class="field-label" style="display:none;">Buscar cliente</div>
      <div class="row">
        <input id="searchInput" type="text" class="search-input" placeholder="Buscar por código, negocio o cliente" />
        <button id="newClientBtn" class="icon-button" title="Nuevo cliente">
          +
        </button>
      </div>
      <div id="searchStatus" class="status-text">Cargue una base de datos .txt para comenzar.</div>
      <div id="results" class="results-list" style="display:none;"></div>
      <div id="selectionInfo" class="row space-between" style="margin-top:4px;">
        <div>
          <div class="selected-badge" id="selectedBadge">Ningún cliente seleccionado.</div>
          <div class="selected-name" id="selectedName"></div>
        </div>
        <button id="saveBtn" class="pill-button" style="min-width:96px;">
          GUARDAR
        </button>
      </div>
    </section>

    <!-- Reestructura -->
    <section class="card restruct-card">
      <div class="row space-between" style="align-items:center;">
        <div>
          <div class="field-label">Tabla reestructurada</div>
          <div class="status-text" id="restructStatus">Presione Reestructura para generar la vista organizada por día.</div>
        </div>
      </div>
      <div class="row" style="gap:6px; margin-top:4px;">
        <button id="toggleRestructBtn" class="icon-button" title="Ocultar/mostrar tabla">
          <span id="toggleVisual" class="toggle-switch on">
            <span class="toggle-knob"></span>
          </span>
        </button>
        <button id="clearBtn" class="icon-button" title="Limpiar asignaciones">🗑️</button>
        <button id="excelBtn" class="pill-button secondary" style="padding:4px 10px;font-size:11px;">EXCEL</button>
        <button id="restructBtn" class="pill-button full restruct-button">Reestructura</button>
      </div>
      <div id="restructContainer"></div>
    </section>

    <div class="footer-space"></div>
  </div>

  <!-- Modal nuevo cliente -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
      <div class="modal-title">Nuevo cliente</div>
      <div class="status-text" id="modalDayInfo"></div>
      <div class="modal-grid">
        <div>
          <div class="field-label">Ruta</div>
          <input id="modalRuta" type="text" class="modal-input" />
        </div>
        <div>
          <div class="field-label">Código negocio</div>
          <input id="modalCodigoNegocio" type="text" class="modal-input" />
        </div>
        <div>
          <div class="field-label">Nombre negocio</div>
          <input id="modalNombreNegocio" type="text" class="modal-input" />
        </div>
        <div>
          <div class="field-label">Nombre cliente</div>
          <input id="modalNombreCliente" type="text" class="modal-input" />
        </div>
        <div>
          <div class="field-label">Dirección</div>
          <input id="modalDireccion" type="text" class="modal-input" />
        </div>
        <div>
          <div class="field-label">Nit facturación</div>
          <input id="modalNit" type="text" class="modal-input" />
        </div>
      </div>
      <div class="modal-actions">
        <button id="cancelModalBtn" class="pill-button secondary">Cancelar</button>
        <button id="saveModalBtn" class="pill-button">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    // Estado principal
    const state = {
      baseData: [], // clientes de la base original + nuevos clientes
      assignedByDay: { // clientes asignados por día
        'Lunes': [],
        'Martes': [],
        'Miércoles': [],
        'Jueves': [],
        'Viernes': [],
        'Sábado': []
      },
      selectedClient: null
    };

    const daysOrder = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

    // Elementos DOM
    const fileInput = document.getElementById('fileInput');
    const routeInput = document.getElementById('routeInput');
    const daySelect = document.getElementById('daySelect');

    const searchInput = document.getElementById('searchInput');
    const searchStatus = document.getElementById('searchStatus');
    const resultsContainer = document.getElementById('results');
    const selectedBadge = document.getElementById('selectedBadge');
    const selectedName = document.getElementById('selectedName');
    const saveBtn = document.getElementById('saveBtn');

    const restructBtn = document.getElementById('restructBtn');
    const restructStatus = document.getElementById('restructStatus');
    const restructContainer = document.getElementById('restructContainer');
    const toggleRestructBtn = document.getElementById('toggleRestructBtn');
    const clearBtn = document.getElementById('clearBtn');
    const excelBtn = document.getElementById('excelBtn');
    const toggleVisual = document.getElementById('toggleVisual');

    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalRuta = document.getElementById('modalRuta');
    const modalCodigoNegocio = document.getElementById('modalCodigoNegocio');
    const modalNombreNegocio = document.getElementById('modalNombreNegocio');
    const modalNombreCliente = document.getElementById('modalNombreCliente');
    const modalDireccion = document.getElementById('modalDireccion');
    const modalNit = document.getElementById('modalNit');
    const modalDayInfo = document.getElementById('modalDayInfo');
    const newClientBtn = document.getElementById('newClientBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const saveModalBtn = document.getElementById('saveModalBtn');

    // Utilidades
    function getTodayLabel() {
      const d = new Date();
      const jsDay = d.getDay(); // 0=Domingo ... 6=Sábado
      const map = {
        1: 'Lunes',
        2: 'Martes',
        3: 'Miércoles',
        4: 'Jueves',
        5: 'Viernes',
        6: 'Sábado'
      };
      return map[jsDay] || 'Lunes';
    }

    // Espera archivos con columnas en este orden:
    // Código Negocio; Nombre Negocio; Nombre Cliente; Dirección; Nit Facturación
    function parseTxtContent(text) {
      const rawLines = text.split(/
?
/);
      const trimmed = rawLines.map(l => l.trim());

      const parsed = [];

      // ¿Viene en una sola línea con separadores (CSV / TXT plano)?
      const hasDelimiters = rawLines.some(l => /[;	,|]/.test(l));

      if (hasDelimiters) {
        // Modo 1: cada CLIENTE está en UNA LÍNEA, separado por ; , tab o |
        const lines = trimmed.filter(l => l.length > 0);

        for (const line of lines) {
          let parts;
          if (line.includes('	')) {
            parts = line.split('	');
          } else if (line.includes(';')) {
            parts = line.split(';');
          } else if (line.includes('|')) {
            parts = line.split('|');
          } else {
            parts = line.split(',');
          }

          if (parts.length < 5) continue;

          const [codigoNegocio, nombreNegocio, nombreCliente, direccion, nitFacturacion] = parts.map(p => p.trim());
          parsed.push({
            codigoNegocio: codigoNegocio || '',
            nombreNegocio: nombreNegocio || '',
            nombreCliente: nombreCliente || '',
            direccion: direccion || '',
            nitFacturacion: nitFacturacion || ''
          });
        }

        return parsed;
      }

      // Modo 2: formato "vertical" como en tu captura:
      // (código)
      // (nombre negocio)
      // (nombre cliente)
      // (dirección)
      // (nit)
      // [línea en blanco]
      const lines = trimmed.filter(l => l.length > 0);

      for (let i = 0; i < lines.length; i++) {
        const linea = lines[i];

        // Saltar encabezados o líneas como "CF" que no son código
        // Código típico: 2000-543590 (empieza con número y suele llevar guion)
        if (!/^[0-9]/.test(linea)) continue;

        const codigoNegocio = linea;
        const nombreNegocio = lines[i + 1] || '';
        const nombreCliente = lines[i + 2] || '';
        const direccion = lines[i + 3] || '';
        const nitFacturacion = lines[i + 4] || '';

        parsed.push({
          codigoNegocio: codigoNegocio.trim(),
          nombreNegocio: nombreNegocio.trim(),
          nombreCliente: nombreCliente.trim(),
          direccion: direccion.trim(),
          nitFacturacion: nitFacturacion.trim()
        });

        // Avanzar 4 posiciones porque ya consumimos 5 líneas de este cliente
        i += 4;
      }

      return parsed;
    }

    function renderSearchResults(list) {
      resultsContainer.innerHTML = '';
      if (!list || list.length === 0) {
        resultsContainer.style.display = 'none';
        return;
      }

      list.forEach(client => {
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `
          <div class="result-name">${client.nombreNegocio || 'Sin nombre de negocio'}</div>
          <div class="result-meta">Código: ${client.codigoNegocio || '-'} · Cliente: ${client.nombreCliente || '-'}</div>
          <div class="result-meta">${client.direccion || ''}</div>
          <div class="result-meta">Nit: ${client.nitFacturacion || ''}</div>
        `;
        item.addEventListener('click', () => {
          state.selectedClient = client;
          selectedBadge.textContent = 'Cliente seleccionado:';
          selectedName.textContent = client.nombreNegocio || client.nombreCliente || 'Sin nombre';
        });
        resultsContainer.appendChild(item);
      });

      resultsContainer.style.display = 'block';
    }

    function searchClients(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        renderSearchResults([]);
        if (state.baseData.length === 0) {
          searchStatus.textContent = 'Cargue una base de datos .txt para comenzar.';
        } else {
          searchStatus.textContent = `Base cargada. Clientes disponibles: ${state.baseData.length}.`;
        }
        return;
      }

      const numeric = /^\d+$/.test(q);
      const matches = state.baseData.filter(c => {
        if (numeric) {
          // Buscar por código o nit
          return (c.codigoNegocio || '').toLowerCase().includes(q) || (c.nitFacturacion || '').toLowerCase().includes(q);
        }
        const nombreNegocio = (c.nombreNegocio || '').toLowerCase();
        const nombreCliente = (c.nombreCliente || '').toLowerCase();
        return nombreNegocio.includes(q) || nombreCliente.includes(q);
      });

      if (matches.length === 0) {
        searchStatus.textContent = 'Sin coincidencias. Puede crear un cliente nuevo con el botón +';
      } else {
        searchStatus.textContent = `Coincidencias encontradas: ${matches.length}`;
      }

      renderSearchResults(matches);
    }

    function ensureUniqueAssignment(day, client) {
      const list = state.assignedByDay[day];
      const key = [
        client.codigoNegocio || '',
        client.nombreNegocio || '',
        client.nombreCliente || ''
      ].join('|').toLowerCase();
      const exists = list.some(c => ([
        c.codigoNegocio || '',
        c.nombreNegocio || '',
        c.nombreCliente || ''
      ].join('|').toLowerCase()) === key);
      if (!exists) {
        list.push({ ...client });
      }
    }

    function renderRestruct() {
      restructContainer.innerHTML = '';

      let hasData = false;
      daysOrder.forEach((dayLabel, idx) => {
        const list = state.assignedByDay[dayLabel];
        if (!list || list.length === 0) return;
        hasData = true;

        const block = document.createElement('div');
        block.className = 'day-block';

        const header = document.createElement('div');
        header.className = 'day-header';
        header.textContent = `DÍA ${idx + 1} – ${dayLabel.toUpperCase()}`;
        block.appendChild(header);

        const tableWrapper = document.createElement('div');
        tableWrapper.className = 'table-wrapper';

        const table = document.createElement('table');
        const thead = document.createElement('thead');
        thead.innerHTML = `
          <tr>
            <th>#</th>
            <th>Ruta</th>
            <th>Código Negocio</th>
            <th>Nombre Negocio</th>
            <th>Nombre Cliente</th>
            <th>Dirección</th>
            <th>Nit</th>
          </tr>
        `;
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        list.forEach((client, index) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${client.ruta || ''}</td>
            <td>${client.codigoNegocio || ''}</td>
            <td>${client.nombreNegocio || ''}</td>
            <td>${client.nombreCliente || ''}</td>
            <td>${client.direccion || ''}</td>
            <td>${client.nitFacturacion || ''}</td>
          `;
          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        tableWrapper.appendChild(table);
        block.appendChild(tableWrapper);
        restructContainer.appendChild(block);
      });

      if (!hasData) {
        restructStatus.textContent = 'Sin clientes asignados todavía. Guarde clientes para ver la reestructura.';
      } else {
        restructStatus.textContent = 'Vista reestructurada generada por día. Use Reestructura cuando actualice la asignación.';
      }
    }

    function openModal() {
      modalRuta.value = routeInput.value.trim();
      modalCodigoNegocio.value = '';
      modalNombreNegocio.value = '';
      modalNombreCliente.value = '';
      modalDireccion.value = '';
      modalNit.value = '';
      const day = daySelect.value;
      modalDayInfo.innerHTML = `Se asignará al día <span class="chip-day">${day}</span>`;
      modalBackdrop.style.display = 'flex';
    }

    function closeModal() {
      modalBackdrop.style.display = 'none';
    }

    // Eventos
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const text = String(evt.target.result || '');
          const parsed = parseTxtContent(text);
          state.baseData = parsed;
          searchStatus.textContent = `Base cargada: ${parsed.length} clientes.`;
          searchClients(searchInput.value || '');
        } catch (err) {
          console.error(err);
          searchStatus.textContent = 'Error al leer el archivo. Verifique el formato.';
          searchStatus.classList.add('error');
        }
      };
      reader.readAsText(file, 'utf-8');
    });

    searchInput.addEventListener('input', (e) => {
      searchClients(e.target.value || '');
    });

    saveBtn.addEventListener('click', () => {
      if (!state.selectedClient) {
        searchStatus.textContent = 'Seleccione un cliente de la lista o cree uno nuevo.';
        searchStatus.classList.add('error');
        return;
      }
      searchStatus.classList.remove('error');

      const day = daySelect.value;
      const currentRoute = routeInput.value.trim();
      const baseClient = state.selectedClient;
      const clientForDay = { ...baseClient };
      if (currentRoute) {
        clientForDay.ruta = currentRoute;
      }

      ensureUniqueAssignment(day, clientForDay);
      restructStatus.textContent = `Cliente asignado a ${day}. Presione Reestructura para actualizar la tabla.`;
    });

    toggleRestructBtn.addEventListener('click', () => {
      const isHidden = restructContainer.style.display === 'none';
      if (isHidden) {
        restructContainer.style.display = 'block';
        toggleVisual.classList.add('on');
      } else {
        restructContainer.style.display = 'none';
        toggleVisual.classList.remove('on');
      }
    });

    clearBtn.addEventListener('click', () => {
      const ok = confirm('¿Está seguro de borrar todas las asignaciones y limpiar la tabla?');
      if (!ok) return;

      Object.keys(state.assignedByDay).forEach(day => {
        state.assignedByDay[day] = [];
      });
      restructContainer.innerHTML = '';
      restructStatus.textContent = 'Datos limpiados. Puede comenzar de nuevo.';
    });

    restructBtn.addEventListener('click', () => {
      renderRestruct();
    });

    excelBtn.addEventListener('click', () => {
      const hasData = daysOrder.some(d => (state.assignedByDay[d] || []).length > 0);
      if (!hasData) {
        alert('No hay datos reestructurados para exportar. Asigne clientes y use Reestructura primero.');
        return;
      }

      // Formato exacto para Excel / SAP
      // Ruta | Día Visita | Orden | Código Negocio | Nombre Negocio | Nombre Cliente | Dirección | Nit Facturación
      const headers = ['RUTA','DÍA VISITA','ORDEN','CÓDIGO NEGOCIO','NOMBRE NEGOCIO','NOMBRE CLIENTE','DIRECCIÓN','NIT FACTURACIÓN'];
      const rows = [];
      rows.push(headers);

      daysOrder.forEach((dayLabel) => {
        const list = state.assignedByDay[dayLabel];
        if (!list || list.length === 0) return;

        list.forEach((client, index) => {
          const ruta = client.ruta || '';
          const diaVisita = dayLabel;
          const orden = index + 1; // posición dentro del día
          const codigoNegocio = client.codigoNegocio || '';
          const nombreNegocio = client.nombreNegocio || '';
          const nombreCliente = client.nombreCliente || '';
          const direccion = client.direccion || '';
          const nit = client.nitFacturacion || '';

          rows.push([
            ruta,
            diaVisita,
            String(orden),
            codigoNegocio,
            nombreNegocio,
            nombreCliente,
            direccion,
            nit
          ]);
        });
      });

      // Construir CSV (usamos ; como separador para que se vea bien en configuraciones ES)
      const csvContent = rows
        .map(cols => cols.map(v => {
          const s = (v ?? '').toString().replace(/"/g, '""');
          return `"${s}"`;
        }).join(';'))
        .join('\r\n');

      const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'Base_reestructurada.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });

    newClientBtn.addEventListener('click', () => {
      if (state.baseData.length === 0) {
        // Permitimos crear aunque no haya base, pero lo indicamos
        searchStatus.textContent = 'Creando cliente nuevo sin base cargada.';
      }
      openModal();
    });

    cancelModalBtn.addEventListener('click', () => {
      closeModal();
    });

    saveModalBtn.addEventListener('click', () => {
      const ruta = modalRuta.value.trim();
      const codigoNegocio = modalCodigoNegocio.value.trim();
      const nombreNegocio = modalNombreNegocio.value.trim();
      const nombreCliente = modalNombreCliente.value.trim();
      const direccion = modalDireccion.value.trim();
      const nitFacturacion = modalNit.value.trim();

      if (!codigoNegocio || !nombreNegocio || !nombreCliente || !direccion || !nitFacturacion) {
        alert('Complete todos los campos del nuevo cliente.');
        return;
      }

      const newClient = { codigoNegocio, nombreNegocio, nombreCliente, direccion, nitFacturacion };

      // Agregar a base interna para futuras búsquedas
      state.baseData.push(newClient);

      // Asignar al día seleccionado
      const day = daySelect.value;
      const clientForDay = { ...newClient };
      const currentRoute = routeInput.value.trim();
      clientForDay.ruta = ruta || currentRoute || '';
      ensureUniqueAssignment(day, clientForDay);

      closeModal();

      // Actualizar mensajes y selección
      state.selectedClient = newClient;
      selectedBadge.textContent = 'Cliente creado y asignado:';
      selectedName.textContent = newClient.nombreNegocio || newClient.nombreCliente;
      searchStatus.textContent = `Cliente nuevo agregado a la base y asignado a ${day}.`;

      // Si hay texto de búsqueda, refrescar
      if (searchInput.value.trim()) {
        searchClients(searchInput.value || '');
      }
    });

    // Cerrar modal al tocar fuera
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) {
        closeModal();
      }
    });

    // Pequeño test dev opcional (activar con ?devtest=1 en la URL)
    function runDevTests() {
      const sample = '2000-1018349;TIENDA LA BENDICION #3;DIEGO TOJIN;EL PROGRESO-SANARATE;CF\n' +
                     '2000-1165850;TIENDA ESQUIPULAS;RICARDO UZ;EL PROGRESO-SANARATE;9430824-1';
      const parsed = parseTxtContent(sample);
      console.assert(parsed.length === 2, 'DevTest: debería leer 2 filas');
      console.assert(parsed[0].codigoNegocio === '2000-1018349', 'DevTest: código incorrecto en fila 1');
      console.assert(parsed[1].nombreNegocio.includes('ESQUIPULAS'), 'DevTest: nombre negocio fila 2');
      console.log('DevTests OK (Registro de Clientes).');
    }

    // Inicialización
    document.addEventListener('DOMContentLoaded', () => {
      const todayLabel = getTodayLabel();
      daySelect.value = todayLabel;

      if (window.location.search.includes('devtest=1')) {
        runDevTests();
      }

      // Registrar service worker para PWA (solo en entornos seguros y compatibles)
      if ('serviceWorker' in navigator && window.isSecureContext) {
        navigator.serviceWorker.register('service-worker.js').catch(() => {
          // En entornos sandbox simplemente ignoramos el error
        });
      }
    });
  </script>
</body>
</html>
